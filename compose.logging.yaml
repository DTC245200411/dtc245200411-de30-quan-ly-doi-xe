services:
  log-storage-init:
    image: alpine:3.23.3
    user: "0:0"
    command: [sh, -ec, "mkdir -p /loki /positions; chown 10001:10001 /loki /positions; chmod 0750 /loki /positions"]
    network_mode: none
    volumes: [loki_data:/loki, promtail_positions:/positions]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  loki:
    image: grafana/loki:3.7.8
    restart: unless-stopped
    user: "10001:10001"
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    depends_on:
      log-storage-init: {condition: service_completed_successfully}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    pids_limit: 100
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  promtail:
    image: grafana/promtail:3.5.11
    restart: unless-stopped
    user: "10001:10001"
    command: [-config.file=/etc/promtail/config.yml]
    volumes:
      - ./observability/promtail/config.yml:/etc/promtail/config.yml:ro
      - promtail_positions:/var/lib/promtail
      - app_logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
      - postgres_logs:/var/log/postgresql:ro
    networks: [monitoring]
    depends_on:
      log-storage-init: {condition: service_completed_successfully}
      loki: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  logrotate:
    build: ./infra/logrotate
    image: de30lam-logrotate:1.0.0
    restart: unless-stopped
    network_mode: none
    volumes:
      - app_logs:/logs/app
      - nginx_logs:/logs/nginx
      - postgres_logs:/logs/postgres
      - logrotate_state:/var/lib/logrotate
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, FOWNER, CHOWN]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    pids_limit: 30
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}
  grafana:
    volumes:
      - ./observability/grafana/loki-datasource.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
volumes:
  loki_data: {}
  promtail_positions: {}
  logrotate_state: {}
