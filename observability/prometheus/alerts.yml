groups:
  - name: hai-availability
    rules:
      - alert: LamFleetTargetDown
        expr: up == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Target {{ $labels.job }} unavailable for 2 minutes"}
      - alert: HaiPostgresUnavailable
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "PostgreSQL exporter cannot connect"}
